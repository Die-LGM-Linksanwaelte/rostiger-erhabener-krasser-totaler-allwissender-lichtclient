name: Build and Release R.E.K.T.A.L.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write




jobs:
  build-linux:
    name: Build and package Linux Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux Release
        run: cargo build --release

      - name: Rename Binaries
        run: |
          cd target/release
          mv gui rektal_client
          mv kernel rektal_kernel

      - name: Create Tarball (.tar.gz)
        run: |
          cd target/release
          tar -czvf rektal-linux-x64.tar.gz rektal_client rektal_kernel

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/rektal-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}




  build-windows:
    name: Build and package Windows Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Extract Version from Tag
        id: get_version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "Building version: $version"

      - name: Build Windows x64 Release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build Windows ARM64 Release
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Installers
        shell: pwsh
        run: |
          $version = $env:VERSION
          
          # --- 1. x64 Installer ---
          New-Item -ItemType Directory -Force windows_dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/gui.exe" "windows_dist/rektal_client.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/kernel.exe" "windows_dist/rektal_kernel.exe"
          
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" /DMyArch="x64" installer.iss
          
          # --- 2. ARM64 Installer ---
          Remove-Item -Recurse -Force windows_dist
          New-Item -ItemType Directory -Force windows_dist | Out-Null
          Copy-Item "target/aarch64-pc-windows-msvc/release/gui.exe" "windows_dist/rektal_client.exe"
          Copy-Item "target/aarch64-pc-windows-msvc/release/kernel.exe" "windows_dist/rektal_kernel.exe"
          
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" /DMyArch="ARM64" installer.iss

      - name: Upload Windows Setups to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            output_installer/Rektal-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}





  build-macos:
    name: Build and package macOS Binaries
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Extract Version from Tag
        id: get_version
        run: |
          # Strips the 'v' prefix from the tag (e.g., converts 'v0.2.1' to '0.2.1')
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Build macOS ARM64 Release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build macOS Intel Release
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create MacOS Installers
        run: |
          # --- 1. ARM64 Package ---
          mkdir -p pkg_root_arm64/usr/local/bin
          cp target/aarch64-apple-darwin/release/gui pkg_root_arm64/usr/local/bin/rektal_client
          cp target/aarch64-apple-darwin/release/kernel pkg_root_arm64/usr/local/bin/rektal_kernel
          
          pkgbuild --root pkg_root_arm64 --identifier de.lgm_linksanwaelte.REKTAL --version "${{ env.VERSION }}" --install-location "/" Rektal-macOS-ARM64-${{ env.VERSION }}.pkg
          
          # --- 2. x86_64 Package ---
          mkdir -p pkg_root_x86/usr/local/bin
          cp target/x86_64-apple-darwin/release/gui pkg_root_x86/usr/local/bin/rektal_client
          cp target/x86_64-apple-darwin/release/kernel pkg_root_x86/usr/local/bin/rektal_kernel
          
          pkgbuild --root pkg_root_x86 --identifier de.lgm_linksanwaelte.REKTAL --version "${{ env.VERSION }}" --install-location "/" Rektal-macOS-x86_64-${{ env.VERSION }}.pkg
  

      - name: Upload macOS Assets to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Rektal-macOS-*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}