[package]
name = "gui"
version = "0.2.1"
edition = "2021"

[dependencies]
eframe = { version = "0.28", features = ["serde"] }
egui_dock = { version = "0.13", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
common = { path = "../common" }
egui_extras = "0.28"
img_crate = { package = "image", version = "0.25", default-features = false, features = ["png"] }
egui = "0.28"
bincode = "1.3.3"

[build-dependencies]
winresource = "0.1.31"

[lib]
path = "src/lib.rs"