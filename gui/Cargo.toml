[package]
name = "gui"
version = "0.1.0"
edition = "2021"

[dependencies]
egui_dock = "0.13"
common = { path = "../common" }
egui_extras = "0.28"
img_crate = { package = "image", version = "0.25", default-features = false, features = ["png"] }
egui = "0.28"
bincode = "1.3.3"

# Linux: Standard eframe mit glow (OpenGL) – exakt wie vorher
[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = "0.28"

# Windows: eframe mit wgpu (kein OpenGL nötig, läuft auch ohne GPU-Treiber)
[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.28", default-features = false, features = ["wgpu", "default_fonts"] }

[build-dependencies]
winresource = "0.1.31"